apiVersion: apps/v1
kind: Deployment
metadata: { name: demo-app, labels: { app: demo-app } }
spec:
  replicas: 2
  selector: { matchLabels: { app: demo-app } }
  template:
    metadata: { labels: { app: demo-app } }
    spec:
      containers:
        - name: demo-app
          image: devops-lab4-app:1.0.0      # GitOps: change this tag via a Git commit
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5000 }]
          env: [{ name: APP_VERSION, value: "1.0.0" }]
          readinessProbe: { httpGet: { path: /health, port: 5000 } }
