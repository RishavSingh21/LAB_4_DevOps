apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: demo-app, namespace: argocd }
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_USERNAME/devops-lab4.git   # <-- CHANGE ME
    targetRevision: main
    path: gitops/apps/demo-app
  destination: { server: https://kubernetes.default.svc, namespace: demo }
  syncPolicy:
    automated: { prune: true, selfHeal: true }   # automated reconciliation
    syncOptions: [CreateNamespace=true]
