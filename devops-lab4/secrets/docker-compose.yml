# DEV-MODE Vault for the lab only. Production: sealed Vault, AppRole/K8s auth, TLS.
services:
  vault:
    image: hashicorp/vault:1.17
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports: ["8200:8200"]
  vault-init:
    image: hashicorp/vault:1.17
    depends_on: [vault]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root-token
      DEMO_DB_PASSWORD: ${DEMO_DB_PASSWORD:-change-me-at-runtime}
    entrypoint: ["/bin/sh","-c","sleep 4 && vault kv put secret/devops-lab4 DB_PASSWORD=$$DEMO_DB_PASSWORD"]
  app:
    build: ../app
    depends_on: [vault-init]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: dev-root-token
    ports: ["5000:5000"]
