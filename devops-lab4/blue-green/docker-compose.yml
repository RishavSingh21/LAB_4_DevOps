services:
  app-blue:
    build: ../app
    environment: { APP_VERSION: "1.0.0", APP_COLOR: blue }
  app-green:
    build: ../app
    environment: { APP_VERSION: "2.0.0", APP_COLOR: green }
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./nginx/conf.d:/etc/nginx/conf.d"]
    depends_on: [app-blue, app-green]
