name: CI/CD Pipeline
on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install flake8 && flake8 app

  secret-scan:               # secret-management gate: no credentials in git
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  unit-tests:                # GATE 1
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r app/requirements-dev.txt
      - run: cd app && pytest tests/test_unit.py --cov=app --cov-fail-under=80

  integration-tests:         # GATE 2
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r app/requirements-dev.txt
      - run: cd app && pytest tests/test_integration.py

  build-and-smoke:           # GATE 3: image must start and be healthy
    needs: [integration-tests, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t devops-lab4-app:${{ github.sha }} app
      - run: |
          docker run -d --name smoke -p 5000:5000 devops-lab4-app:${{ github.sha }}
          for i in $(seq 1 15); do curl -fs localhost:5000/health && exit 0; sleep 2; done
          docker logs smoke; exit 1

  deploy:                    # runs ONLY if every gate above passed
    needs: build-and-smoke
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # GitHub-managed secret, never in code
      - run: |
          IMG=ghcr.io/${{ github.repository_owner }}/devops-lab4-app:${{ github.sha }}
          docker build -t $IMG app && docker push $IMG
      - run: echo "GitOps: bump image tag in gitops/apps/demo-app/deployment.yaml; Argo CD deploys it."
