services:
  app-stable:
    build: ../app
    environment: { APP_VERSION: "1.0.0", APP_COLOR: stable }
    ports: ["8081:5000"]
  app-canary:
    build: ../app
    environment:
      APP_VERSION: "2.0.0"
      APP_COLOR: canary
      ERROR_RATE: "${CANARY_ERROR_RATE:-0}"
    ports: ["8082:5000"]
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./nginx/conf.d:/etc/nginx/conf.d"]
    depends_on: [app-stable, app-canary]
