services:
  db-primary:
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: drdemo, POSTGRES_DB: shop }
    ports: ["5433:5432"]
    volumes: ["./seed.sql:/docker-entrypoint-initdb.d/seed.sql"]
  db-standby:        # DR site: empty until failover
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: drdemo, POSTGRES_DB: shop }
    ports: ["5434:5432"]
